<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body,
        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
        }
        #result {
            display: none;
        }
    </style>
</head>
<body>
    <iframe id="game" title="Game layout test"></iframe>
    <pre id="result"></pre>
    <script>
        const frame = document.getElementById("game");
        const resultElement = document.getElementById("result");
        const parameters = new URLSearchParams(window.location.search);
        frame.style.width = parameters.get("width") + "px";
        frame.style.height = parameters.get("height") + "px";

        const rectangle = element => {
            const value = element.getBoundingClientRect();

            return {
                top: value.top,
                right: value.right,
                bottom: value.bottom,
                left: value.left,
                width: value.width,
                height: value.height,
                centerX: value.left + value.width / 2,
                centerY: value.top + value.height / 2,
            };
        };
        const fontSize = element =>
            Number.parseFloat(frame.contentWindow.getComputedStyle(element).fontSize);
        const cellAt = (document, x, y) =>
            document.elementFromPoint(x, y)?.closest(".cell") !== null;

        const measure = () => {
            const window = frame.contentWindow;
            const document = frame.contentDocument;
            const map = document.getElementById("map");
            const cat = document.getElementById("cat");
            const message = document.getElementById("messageBox");
            const encounterCard = document.getElementById("encounterCard");
            const container = document.getElementById("mapContainer");
            if (
                map === null
                || map.children.length === 0
                || cat === null
                || message === null
                || encounterCard === null
                || container === null
            ) {
                window.setTimeout(measure, 50);

                return;
            }

            const textRange = document.createRange();
            textRange.selectNodeContents(message);
            const textRectangle = textRange.getBoundingClientRect();
            const messageHeightWithoutButton = message.getBoundingClientRect().height;
            const controls = [
                "inventoryControl",
                "restartControl",
                "labelsControl",
                "soundControl",
                "exploreControl",
            ].map(id => {
                const element = document.getElementById(id);

                return {
                    id,
                    rectangle: rectangle(element),
                    fontSize: fontSize(element),
                };
            });
            const measurement = {
                viewport: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                },
                container: rectangle(container),
                map: rectangle(map),
                cat: rectangle(cat),
                message: {
                    rectangle: rectangle(message),
                    text: {
                        top: textRectangle.top,
                        bottom: textRectangle.bottom,
                        height: textRectangle.height,
                        centerY: textRectangle.top + textRectangle.height / 2,
                    },
                    fontSize: fontSize(message),
                },
                gps: {
                    rectangle: rectangle(document.getElementById("gpsStatus")),
                    fontSize: fontSize(document.getElementById("gpsStatus")),
                },
                navigation: {
                    rectangle: rectangle(
                        document.getElementById("navigationInstrument"),
                    ),
                    label: document
                        .getElementById("navigationInstrument")
                        .getAttribute("aria-label"),
                },
                compass: {
                    rectangle: rectangle(
                        document.getElementById("compassIndicator"),
                    ),
                    label: document
                        .getElementById("compassIndicator")
                        .getAttribute("aria-label"),
                },
                controls,
                paintedEdges: {
                    right: cellAt(
                        document,
                        window.innerWidth - 1,
                        window.innerHeight / 2,
                    ),
                    bottom: cellAt(
                        document,
                        window.innerWidth / 2,
                        window.innerHeight - 1,
                    ),
                },
                document: {
                    scrollWidth: document.documentElement.scrollWidth,
                    scrollHeight: document.documentElement.scrollHeight,
                },
            };
            const labelsSwitch = document.getElementById("labelsSwitch");
            const mapLabels = [...document.querySelectorAll(".map-item-label")];
            measurement.labels = {
                count: mapLabels.length,
                checkedBefore: labelsSwitch.checked,
                enabledBefore:
                    container.classList.contains("map-labels-enabled"),
                visibleBefore: mapLabels.filter(label =>
                    window.getComputedStyle(label).display !== "none"
                ).length,
            };
            labelsSwitch.click();
            measurement.labels.checkedAfter = labelsSwitch.checked;
            measurement.labels.enabledAfter =
                container.classList.contains("map-labels-enabled");
            measurement.labels.visibleAfter = mapLabels.filter(label =>
                window.getComputedStyle(label).display !== "none"
            ).length;
            const itemLink = message.querySelector(".status-item-link");
            if (itemLink instanceof window.HTMLButtonElement) {
                itemLink.click();
                const focusedLabels = mapLabels.filter(label =>
                    window.getComputedStyle(label).display !== "none"
                );
                measurement.message.itemToggle = {
                    opens: encounterCard.hidden === false,
                    ownedText: encounterCard.querySelector(
                        ".encounter-card-owned",
                    )?.textContent ?? "",
                    expandedWhenOpen:
                        itemLink.getAttribute("aria-expanded"),
                    focusModeWhenOpen:
                        container.classList.contains("map-labels-item-focus"),
                    focusedType: itemLink.dataset.itemName,
                    focusedLabelCount: focusedLabels.length,
                    matchingLabelCount: mapLabels.filter(label =>
                        label.dataset.itemName === itemLink.dataset.itemName
                    ).length,
                    onlyMatchingLabels: focusedLabels.every(label =>
                        label.dataset.itemName === itemLink.dataset.itemName
                    ),
                };
                labelsSwitch.click();
                measurement.message.itemToggle.visibleLabelsWhenUnchecked =
                    mapLabels.filter(label =>
                        window.getComputedStyle(label).display !== "none"
                    ).length;
                labelsSwitch.click();
                itemLink.click();
                measurement.message.itemToggle.closes =
                    encounterCard.hidden === true;
                measurement.message.itemToggle.expandedWhenClosed =
                    itemLink.getAttribute("aria-expanded");
                measurement.message.itemToggle.focusModeWhenClosed =
                    container.classList.contains("map-labels-item-focus");
                measurement.message.itemToggle.visibleLabelsAfterClose =
                    mapLabels.filter(label =>
                        window.getComputedStyle(label).display !== "none"
                    ).length;
            }

            const labelledItemCell = document.querySelector(
                ".cell.map-item-labelled",
            );
            if (labelledItemCell instanceof window.HTMLElement) {
                labelledItemCell.click();
                const selectedItemLabel = document.querySelector(
                    ".cell.selected .map-item-label--item-focus",
                );
                measurement.labels.clickedItemLabel = {
                    found: selectedItemLabel !== null,
                    visible: selectedItemLabel !== null
                        && window.getComputedStyle(selectedItemLabel).display
                            !== "none",
                    itemName: selectedItemLabel?.dataset.itemName ?? "",
                };
                const clickedItemOwned = encounterCard.querySelector(
                    ".encounter-card-owned",
                );
                measurement.labels.clickedItemOwned = {
                    text: clickedItemOwned?.textContent ?? "",
                    followsTitle: clickedItemOwned?.previousElementSibling
                        ?.classList.contains("encounter-card-title") ?? false,
                };
                const selectedItemCell = document.querySelector(
                    ".cell.selected.selected-item",
                );
                const selectionRing = selectedItemCell === null
                    ? null
                    : window.getComputedStyle(selectedItemCell, "::after");
                measurement.labels.clickedItemSelection = {
                    hasItemSelectionClass: selectedItemCell !== null,
                    tileOutline: selectedItemCell === null
                        ? ""
                        : window.getComputedStyle(selectedItemCell).outlineStyle,
                    ringContent: selectionRing?.content ?? "",
                    ringBorderStyle: selectionRing?.borderStyle ?? "",
                    ringWidth: selectionRing?.width ?? "",
                };
                labelsSwitch.click();
                measurement.labels.visibleDuringFocusWhenUnchecked = [
                    ...document.querySelectorAll(".map-item-label"),
                ].filter(label =>
                    window.getComputedStyle(label).display !== "none"
                ).length;
                labelsSwitch.click();
                encounterCard.querySelector(".encounter-card-close")?.click();
            }
            const buttonMessage = document.createElement("div");
            buttonMessage.className = "message";
            const button = document.createElement("button");
            button.className = "button";
            button.type = "button";
            button.textContent = "Take item";
            buttonMessage.append(button, " with required materials.");
            message.replaceChildren(buttonMessage);
            measurement.message.buttonState = {
                barHeight: message.getBoundingClientRect().height,
                buttonHeight: button.getBoundingClientRect().height,
            };
            measurement.message.heightWithoutButton =
                messageHeightWithoutButton;

            const encounterAction = document.createElement("div");
            encounterAction.className =
                "message encounter-action encounter-action--fight";
            const tradeButton = document.createElement("button");
            tradeButton.className = "button";
            tradeButton.type = "button";
            tradeButton.textContent = "Capture";
            const fightReward = document.createElement("span");
            fightReward.className = "fight-reward";
            fightReward.textContent =
                "a crypt hound. If you succeed, one binding rope is used. "
                    + "You keep the crypt hound and take its 10 coins.";
            encounterAction.append(
                tradeButton,
                fightReward,
            );
            message.replaceChildren(encounterAction);
            encounterCard.hidden = false;
            const encounterClose = document.createElement("button");
            encounterClose.className = "fight-close encounter-card-close";
            encounterClose.type = "button";
            encounterClose.setAttribute(
                "aria-label",
                "Close encounter details",
            );
            const encounterTitle = document.createElement("h2");
            encounterTitle.className = "encounter-card-title";
            encounterTitle.textContent = "Crypt hound";
            const monsterDescription = document.createElement("span");
            monsterDescription.className = "encounter-card-description";
            monsterDescription.textContent = [
                "Dame Floofbert, a magnificently fluffy cat who has never",
                "forgiven a dishonest turnip, believes haggling is a form",
                "of opera, keeps every receipt beneath the left paw, and",
                "offers certified pre-admired swords with a solemn guarantee",
                "lasting precisely until teatime. Tap this card for the full",
                "story and all the wonderfully suspicious trading details.",
            ].join(" ");
            const itemDescription = document.createElement("div");
            itemDescription.className =
                "encounter-card-details item-explanation";
            const facts = document.createElement("dl");
            facts.className = "item-explanation-facts";
            for (const [headingText, sectionText] of [[
                "Fight",
                "A successful capture uses a binding rope to bind it. "
                    + "Capture it to keep the monster and take 10 coins.",
            ]]) {
                const heading = document.createElement("dt");
                heading.className = "item-explanation-heading";
                heading.textContent = headingText;
                const text = document.createElement("dd");
                text.className = "item-explanation-text";
                text.textContent = sectionText;
                facts.append(heading, text);
            }
            const fieldNote = document.createElement("footer");
            fieldNote.className = "item-explanation-note";
            const noteText = document.createElement("q");
            noteText.textContent = [
                "Monsters consistently rate useful equipment one star.",
                "The quartermaster considers the matter settled.",
            ].join(" ");
            fieldNote.append(noteText);
            itemDescription.append(facts, fieldNote);
            encounterCard.replaceChildren(
                encounterClose,
                encounterTitle,
                monsterDescription,
                itemDescription,
            );
            const descriptionCard = rectangle(encounterCard);
            measurement.message.encounterState = {
                barHeight: message.getBoundingClientRect().height,
                barText: message.textContent.trim(),
                action: rectangle(tradeButton),
                followingTextMargin: Number.parseFloat(
                    window.getComputedStyle(fightReward).marginLeft,
                ),
                descriptionCard,
                descriptionScrollHeight: encounterCard.scrollHeight,
                descriptionClientHeight: encounterCard.clientHeight,
                close: rectangle(encounterClose),
            };

            const instructionTexts = [
                "Find a stick and a root to craft a club.",
                "Find yarrow to increase your starting health in fights.",
                "Find one more yarrow to improve your starting health even further.",
                        "Gather one more yarrow and a hay to make a yarrow poultice.",
                "Find and craft a yarrow poultice to heal yourself during fights.",
                "Find and capture a rat to gain 10 coins and another attack.",
                "Find 5 stones and a hay to craft a crucible for smelting iron.",
                "Find and craft a crucible to smelt iron.",
                "Find 3 iron ore and 3 hay to smelt iron.",
                "Find a dungeon entrance and descend to find a furnace for smelting iron.",
                "Find a furnace and smelt your iron ore into iron.",
                "Find 12 more yarrow to raise your health before capturing a troll.",
                "Find a stick, 2 roots and 1 iron for an iron-spiked club. "
                    + "Five upgraded weapons will prepare you to capture a troll.",
                "Find and craft an iron-spiked club. "
                    + "Five upgraded weapons will prepare you to capture a troll.",
                "Get 2 hay for a binding rope.",
                "Collect dungeon materials and craft your first dungeon weapon.",
                "Find and capture the weakest dungeon monster to gain dungeon materials.",
            ];
            measurement.message.instructions = instructionTexts.map(text => {
                const status = document.createElement("div");
                status.className = "message status-text";
                status.textContent = text;
                message.replaceChildren(status);

                return {
                    text,
                    clientWidth: status.clientWidth,
                    scrollWidth: status.scrollWidth,
                    clientHeight: status.clientHeight,
                    scrollHeight: status.scrollHeight,
                    barHeight: message.getBoundingClientRect().height,
                };
            });
            const longStatus = document.createElement("div");
            longStatus.className = "message status-text";
            longStatus.textContent = [
                "This deliberately enormous status message must be visibly",
                "shortened when it cannot fit inside the fixed status bar,",
                "even on a broad desktop where an absent ellipsis might hide",
                "for years behind several inventories, a confused troll,",
                "and an auditor carrying an unreasonable number of torches.",
            ].join(" ");
            message.replaceChildren(longStatus);
            const longStatusStyle = window.getComputedStyle(longStatus);
            measurement.message.longStatus = {
                clientWidth: longStatus.clientWidth,
                scrollWidth: longStatus.scrollWidth,
                overflow: longStatusStyle.overflow,
                textOverflow: longStatusStyle.textOverflow,
                whiteSpace: longStatusStyle.whiteSpace,
                clientHeight: longStatus.clientHeight,
                scrollHeight: longStatus.scrollHeight,
                barHeight: message.getBoundingClientRect().height,
            };

            const fightOverlay = document.createElement("div");
            fightOverlay.className = "fight-overlay";
            const fightPanel = document.createElement("section");
            fightPanel.className = "fight-panel";
            const fightHeader = document.createElement("header");
            fightHeader.className = "dialog-header";
            const fightTitle = document.createElement("h1");
            fightTitle.textContent = "Battle";
            const fightClose = document.createElement("button");
            fightClose.className = "fight-close";
            fightClose.type = "button";
            fightClose.setAttribute("aria-label", "Retreat");
            fightHeader.append(fightTitle, fightClose);
            const fightContent = document.createElement("div");
            fightContent.className = "dialog-content";
            const fightFiller = document.createElement("div");
            fightFiller.style.height = "1200px";
            fightContent.append(fightFiller);
            fightPanel.append(fightHeader, fightContent);
            fightOverlay.append(fightPanel);
            document.body.append(fightOverlay);
            const fightPanelStyle = window.getComputedStyle(fightPanel);
            const fightHeaderBeforeScroll = rectangle(fightHeader);
            fightContent.scrollTop = 200;
            const fightDialog = {
                rectangle: rectangle(fightPanel),
                borderRadius: fightPanelStyle.borderRadius,
                overflow: fightPanelStyle.overflow,
                contentOverflow:
                    window.getComputedStyle(fightContent).overflow,
                contentScrollTop: fightContent.scrollTop,
                headerBeforeScroll: fightHeaderBeforeScroll,
                headerAfterScroll: rectangle(fightHeader),
                title: rectangle(fightTitle),
                close: rectangle(fightClose),
            };
            fightOverlay.remove();

            const actualInventoryControl = document.getElementById(
                "inventoryControl",
            );
            actualInventoryControl.disabled = false;
            actualInventoryControl.click();
            const actualInventory = document.querySelector(
                ".inventory-dialog[open]",
            );
            const actualItemsTab = actualInventory.querySelector(
                "#inventory-items-tab",
            );
            const actualRecipesTab = actualInventory.querySelector(
                "#inventory-recipes-tab",
            );
            actualRecipesTab.click();
            const clubRecipe = actualInventory.querySelector(
                '.recipe-entry[data-item-name="club"]',
            );
            const clubRecipeToggle = clubRecipe.querySelector(
                ".recipe-entry-toggle",
            );
            clubRecipeToggle.click();
            const actualInventoryMeasurement = {
                itemsTab: rectangle(actualItemsTab),
                recipesTab: rectangle(actualRecipesTab),
                itemsSelected: actualItemsTab.getAttribute("aria-selected"),
                recipesSelected:
                    actualRecipesTab.getAttribute("aria-selected"),
                recipeCount: actualInventory.querySelectorAll(
                    ".recipe-entry",
                ).length,
                filterHeight: actualInventory.querySelector(
                    ".recipe-filter",
                ).getBoundingClientRect().height,
                clubRecipe: rectangle(clubRecipe),
                clubExpanded: clubRecipeToggle.getAttribute("aria-expanded"),
                clubDetailsHidden: clubRecipe.querySelector(
                    ".recipe-entry-details",
                ).hidden,
                clubIngredientCounts: Array.from(clubRecipe.querySelectorAll(
                    ".recipe-ingredient strong",
                )).map(value => value.textContent),
                header: rectangle(actualInventory.querySelector(
                    ".dialog-header",
                )),
                tabs: rectangle(actualInventory.querySelector(
                    ".inventory-tabs",
                )),
            };
            actualInventory.querySelector(".fight-close").click();

            const inventoryDialog = document.createElement("dialog");
            inventoryDialog.className = "inventory-dialog";
            const inventoryHeader = document.createElement("header");
            inventoryHeader.className = "dialog-header";
            const inventoryTitle = document.createElement("h1");
            inventoryTitle.textContent = "Inventory";
            const inventoryClose = document.createElement("button");
            inventoryClose.className = "fight-close";
            inventoryClose.type = "button";
            inventoryClose.setAttribute("aria-label", "Close inventory");
            inventoryHeader.append(inventoryTitle, inventoryClose);
            const inventoryContent = document.createElement("div");
            inventoryContent.className = "dialog-content";
            const inventoryFiller = document.createElement("div");
            inventoryFiller.style.height = "1200px";
            inventoryContent.append(inventoryFiller);
            inventoryDialog.append(inventoryHeader, inventoryContent);
            document.body.append(inventoryDialog);
            inventoryDialog.showModal();
            const inventoryDialogStyle =
                window.getComputedStyle(inventoryDialog);
            const inventoryHeaderBeforeScroll = rectangle(inventoryHeader);
            inventoryContent.scrollTop = 200;
            const inventoryDialogMeasurement = {
                rectangle: rectangle(inventoryDialog),
                borderRadius: inventoryDialogStyle.borderRadius,
                overflow: inventoryDialogStyle.overflow,
                contentOverflow:
                    window.getComputedStyle(inventoryContent).overflow,
                contentScrollTop: inventoryContent.scrollTop,
                headerBeforeScroll: inventoryHeaderBeforeScroll,
                headerAfterScroll: rectangle(inventoryHeader),
                title: rectangle(inventoryTitle),
                close: rectangle(inventoryClose),
            };
            inventoryDialog.close();
            inventoryDialog.remove();
            measurement.dialogs = {
                fight: fightDialog,
                inventory: inventoryDialogMeasurement,
            };
            measurement.actualInventory = actualInventoryMeasurement;

            resultElement.textContent = window.btoa(
                window.unescape(
                    window.encodeURIComponent(JSON.stringify(measurement)),
                ),
            );
        };

        localStorage.setItem("gpsgame.inventory", JSON.stringify({
            version: 2,
            usedCoordinates: {
                "1,38,0": true,
                "1,111,0": true,
                "1,1021,0": true,
            },
        }));
        frame.src = "../game.html";
        window.setTimeout(measure, 50);
    </script>
</body>
</html>
