<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#26351f">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mapContainer">
        <div id="messageBox"></div>
        <aside
            id="encounterCard"
            class="encounter-card"
            aria-label="Encounter details"
            hidden
        ></aside>
        <label id="exploreControl">
            <input id="exploreSwitch" type="checkbox">
            <span>Explore</span>
        </label>
        <label id="soundControl">
            <input id="soundSwitch" type="checkbox">
            <span>Sound</span>
        </label>
        <button id="inventoryControl" type="button">0 items</button>
        <button id="restartControl" type="button">Restart</button>
        <div
            id="compassIndicator"
            role="img"
            aria-label="North points right"
            title="North"
        >
            <span class="compass-arrow" aria-hidden="true"></span>
            <span class="compass-north" aria-hidden="true">N</span>
        </div>
        <div id="gpsStatus" role="status" aria-live="polite">Finding location.</div>
        <div id="map"></div>
    </div>

    <script type="module">
        import { GameController } from "./js/GameController.js";

        new GameController().start();
    </script>
</body>
</html>
